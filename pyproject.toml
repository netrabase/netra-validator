[project]
name = "netra-validator"
version = "0.1.0"
description = "High-performance out-of-core data validation tool built with Polars and DuckDB."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Nitin Paul", email = "nitinpaul.dev@gmail.com" }]
license = { text = "MIT" }
dependencies = [
    "polars>=1.0.0",
    "pyarrow>=14.0.0",
    "duckdb>=1.5.4",
    "pydantic>=2.7.0",
    "pyyaml>=6.0.3",
    "typer>=0.24.0",
    "rich>=14.3.1",
    "netra-core>=0.1.0",
    "psutil>=7.2.2 ; sys_platform == 'win32'",
]

[project.urls]
Homepage = "https://github.com/netrabase/netra-validator"
Repository = "https://github.com/netrabase/netra-validator"
Issues = "https://github.com/netrabase/netra-validator/issues"

[dependency-groups]
benchmark = [
    "numpy>=1.26.0",
    "polars>=1.0.0",
    "psutil>=5.9.0",
]
dev = [
    "mypy>=1.10.0",
    "pytest>=8.2.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
    "types-PyYAML>=6.0.12",
]

[project.entry-points."netra.subcommands"]
validate = "netra_validator.cli.main:register"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# --- Tool Configuration ---

# Hatchling (Build Backend)
[tool.hatch.build.targets.wheel]
packages = ["src/netra_validator"]

# Ruff (Linter & Formatter)
[tool.ruff]
line-length = 100
target-version = "py310"   # Enforce Python 3.10+ compatibility
src = ["src"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort (import sorting)
    "B",   # flake8-bugbear (common bugs)
    "UP",  # pyupgrade (modernize python syntax)
    "N",   # pep8-naming
    "SIM", # flake8-simplify
    "PL",  # pylint (complexity checks)
]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["netra_validator"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "PLR0913", # Allow multiple pytest fixtures in test function signatures
    "PLR2004", # Allow literal numbers in test assertions
]

# Mypy (Static Type Checker)
[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true

# Pytest (Testing Framework)
[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config -ra"
testpaths = ["tests"]
